# Shidashi CI — qualidade (real) + release semanal (scaffold, gated).
#
# Dois gatilhos:
#   * push / pull_request -> job `quality` (real): roda em runner padrao, sem
#     Gentoo. Instala pelo uv.lock (--frozen); lint (ruff check) + format (ruff
#     format --check) + tipos (mypy) + testes (pytest). Rode antes do push com
#     `act -j quality`.
#   * schedule (semanal)  -> job `weekly-release` (scaffold): a matriz
#     arch x init x desktop. Gated com `if: false` porque precisa de um
#     runner self-hosted Gentoo (OVERVIEW fase 4) — documenta a intencao sem
#     quebrar a CI.
name: release

on:
  push:
  pull_request:
  schedule:
    # toda semana, domingo 00:00 UTC — apenas para o scaffold gated abaixo.
    - cron: "0 0 * * 0"

jobs:
  quality:
    name: quality (lint + types + tests)
    runs-on: ubuntu-latest
    # read-only token: this job only checks out and runs the local gates
    permissions:
      contents: read
    steps:
      # Actions pinned by commit SHA, never a mutable tag (the tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.14"

      # Frozen: exactly uv.lock, never a fresh resolution (pyproject's [tool.uv]
      # also refuses any version younger than 7 days).
      - name: Install (locked, with dev)
        run: uv sync --frozen --extra dev

      - name: Ruff check
        run: uv run --frozen ruff check .

      - name: Ruff format --check
        run: uv run --frozen ruff format --check .

      - name: Mypy (strict)
        run: uv run --frozen mypy .

      - name: Pytest
        run: uv run --frozen pytest

  weekly-release:
    name: weekly-release (scaffold — needs Gentoo runner)
    # GATED: este job NAO roda. A matriz arch x init x desktop exige um runner
    # self-hosted Gentoo (stage3 + emerge + systemd-nspawn), indisponivel nos
    # runners hospedados do GitHub. Habilitar na OVERVIEW fase 4 trocando o
    # `if` por uma condicao real (ex.: github.event_name == 'schedule').
    if: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [v3, znver5, arrowlake]
        init: [systemd, openrc]
        desktop: [minimal, kde, gnome, wm]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # TODO(phase-4): seed stage3 -> shidashi factory -> shidashi assemble -> publicar
      #   o artefato da combinacao arch x desktop x init da matriz.
      - name: Placeholder
        run: echo "scaffold — habilitar na fase 4 num runner Gentoo"
