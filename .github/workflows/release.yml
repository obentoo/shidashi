# Shidashi CI -- quality (real) + weekly release (scaffold, gated).
#
# Remote runs only what local cannot:
#   * pull_request / manual -> job `quality` (real): runs on a standard runner,
#     without Gentoo. Installs from uv.lock (--frozen); lint (ruff check) +
#     format (ruff format --check) + types (mypy) + tests (pytest). It checks
#     a contributor's code on a neutral machine. NOT on push: a push to main
#     shares work already verified locally -- run `act pull_request -j quality`
#     before pushing.
#   * schedule (weekly)     -> job `weekly-release` (scaffold): the
#     arch x init x desktop matrix. Gated with `if: false` because it needs a
#     self-hosted Gentoo runner (OVERVIEW phase 4) -- it documents the intent
#     without breaking CI.
# CodeQL is not here: it runs from the repository's code-scanning default setup.
name: release

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # every Sunday, 00:00 UTC -- only for the gated scaffold below.
    - cron: "0 0 * * 0"

jobs:
  quality:
    name: quality (lint + types + tests)
    # Pinned image, like the actions below: ubuntu-latest moves to Ubuntu 26 on
    # 2026-10-19, and the runner should change only by a commit.
    runs-on: ubuntu-24.04
    # the weekly schedule is the release scaffold's, not a reason to re-run the gates
    if: github.event_name != 'schedule'
    # read-only token: this job only checks out and runs the local gates
    permissions:
      contents: read
    steps:
      # Actions pinned by commit SHA, never a mutable tag (the tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tools the provisioning, publish and VM tests drive for real; without them
      # those tests skip and CI never covers them. rsync is already on the hosted
      # runner -- it is listed so `act` (whose image lacks it) runs the worker tests too.
      - name: Install test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xorriso squashfs-tools qemu-utils mtools rsync

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # The uv the maintainers' Gentoo hosts ship (dev-python/uv), so CI and
          # local runs agree. Dependabot does not move this input: bump it by hand
          # when ::gentoo does.
          version: "0.12.23"
          python-version: "3.14"

      # Frozen: exactly uv.lock, never a fresh resolution (pyproject's [tool.uv]
      # also refuses any version younger than 7 days).
      - name: Install (locked, with dev)
        run: uv sync --frozen --extra dev

      - name: Ruff check
        run: uv run --frozen ruff check .

      - name: Ruff format --check
        run: uv run --frozen ruff format --check .

      - name: Mypy (strict)
        run: uv run --frozen mypy .

      - name: Pytest
        run: uv run --frozen pytest

  weekly-release:
    name: weekly-release (scaffold — needs Gentoo runner)
    # GATED: this job does NOT run. The arch x init x desktop matrix needs a
    # self-hosted Gentoo runner (stage3 + emerge + systemd-nspawn), which
    # GitHub-hosted runners do not provide. Enable it in OVERVIEW phase 4 by
    # replacing the `if` with a real condition (e.g. github.event_name == 'schedule').
    if: false
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [v3, znver5, arrowlake]
        init: [systemd, openrc]
        desktop: [minimal, kde, gnome, wm]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # TODO(phase-4): seed stage3 -> shidashi factory -> shidashi assemble -> publish
      #   the artifact of the matrix's arch x desktop x init combination.
      - name: Placeholder
        run: echo "scaffold -- enable in phase 4 on a Gentoo runner"
