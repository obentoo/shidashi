[project]
name = "shidashi"
version = "0.0.1"
description = "Shidashi: builds Bentoo (Gentoo stage5) images and live ISOs from a stage3, phase by phase."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lucascs", email = "lucascs@protonmail.com" }]
dependencies = [
    "pydantic>=2.10",   # wheels pydantic-core p/ CPython 3.14
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.7",
]
# NB: `portage` comes from the system (sys-apps/portage), not from pip.
# Shidashi runs on a Gentoo host and uses `import portage` (see shidashi/portage_api.py).

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10", "types-PyYAML", "pytest>=8"]

[project.scripts]
shidashi = "shidashi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Supply chain: never resolve a version uploaded less than 7 days ago -- enforced
# here, not by hand. Install with `uv sync --frozen --extra dev` (uv.lock).
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["shidashi"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
