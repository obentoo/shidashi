[project]
name = "shidashi"
version = "0.0.1"
description = "Shidashi — catering de builds e ISOs do bentoo (Gentoo stage4) a partir de um stage3."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "lucascs", email = "lucascs@protonmail.com" }]
dependencies = [
    "pydantic>=2.10",   # wheels pydantic-core p/ CPython 3.14
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.7",
]
# NB: `portage` é fornecido pelo sistema (sys-apps/portage), não via pip.
# O Shidashi roda num host Gentoo e usa `import portage` (ver shidashi/portage_api.py).

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10", "types-PyYAML", "pytest>=8"]

[project.scripts]
shidashi = "shidashi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shidashi"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
