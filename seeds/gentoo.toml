# The pinned ::gentoo tree (D26) -- consumed by shidashi.tree.load_tree_pin.
#
# Every factory, assemble and pretend run binds THIS snapshot at
# /var/db/repos/gentoo inside the container, never the host's synced tree: the
# binpkgs and the ISO come from the same ebuilds, and a build is reproducible.
#
# Cooldown: the snapshot must be at least 7 days old on the day of the build
# (shidashi.tree.COOLDOWN_DAYS). A weekly update re-pins to today - 7.
#
# The mirror keeps only ~8 days of daily snapshots; the verified tarball is cached
# under <cache>/trees/ and survives its rotation. To re-pin:
#   D=<YYYYMMDD>; F=gentoo-$D.tar.xz
#   curl -fsSLO https://distfiles.gentoo.org/snapshots/$F{,.gpgsig}
#   gpg --verify $F.gpgsig $F   # Gentoo ebuild repository signing key
#   sha512sum $F                # -> sha512 below
# and update date + sha512 together.

# 2026-10-05: gentoo-20260926 rotated off the mirror (404) a day after it was
# pinned; re-pinned to 20260928, the newest the cooldown allows.
# GOODSIG + VALIDSIG by E1D6ABB63BFCFB4BA02FDF1CEC590EEAC9189250 (Gentoo ebuild
# repository signing key) against /usr/share/openpgp-keys/gentoo-release.asc
# before the hash was copied.
date = "20260928"
base_url = "https://distfiles.gentoo.org/snapshots"
sha512 = "2947bcc8417c8df44993cef8250d5c771d0da7570278446ba86cbdff6372edf56f9ddd05a07cbd5e6caec406c132b1df29254e25ee4ed1e55d0e17fc599ac747"
