# Pointer pinado do stage3 (OVERVIEW §10/§11) — consumido por shidashi.seed.load_pointer.
#
# Um único snapshot compartilhado por init; uma tabela por init com o filename
# do tarball nomultilib e seu SHA-512. A URL do mirror é montada por stage3_url
# como <base_url>/<snapshot>/<filename>, e o sibling <filename>.DIGESTS
# (cleartext-signed, assinatura PGP inline) é baixado junto para a verificação GPG.
#
# NOTA(host): os autobuilds da Gentoo rotacionam — só os snapshots recentes
# ficam no mirror; um pin antigo expira (404). O .DIGESTS publica BLAKE2B e
# SHA512 (não SHA256); pinamos o SHA512, lido do próprio .DIGESTS ou computado
# sobre o tarball baixado do snapshot pinado, p.ex.:
#   F=<filename>; curl -fsSLO <base_url>/<snapshot>/$F && sha512sum $F
# A autenticidade vem do GPG sobre o .DIGESTS inline-signed (shidashi.seed.
# verify_signature); o sha512 pino trava os bytes exatos (reprodução).
# Ao re-pinar, atualize snapshot + os dois filename + os dois sha512 juntos.

