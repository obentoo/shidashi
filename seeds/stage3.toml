# Pinned stage3 pointer (OVERVIEW §10/§11) — consumed by shidashi.seed.load_pointer.
#
# A single snapshot shared across inits; one table per init with the filename
# of the nomultilib tarball and its SHA-512. The mirror URL is built by stage3_url
# as <base_url>/<snapshot>/<filename>, and the sibling <filename>.DIGESTS
# (cleartext-signed, inline PGP signature) is downloaded alongside for GPG verification.
#
# NOTE(host): Gentoo's autobuilds rotate — only recent snapshots
# stay on the mirror; an old pin expires (404). The .DIGESTS publishes BLAKE2B and
# SHA512 (not SHA256); we pin the SHA512, read from the .DIGESTS itself or computed
# over the tarball downloaded from the pinned snapshot, e.g.:
#   F=<filename>; curl -fsSLO <base_url>/<snapshot>/$F && sha512sum $F
# Authenticity comes from GPG over the inline-signed .DIGESTS (shidashi.seed.
# verify_signature); the pinned sha512 locks the exact bytes (reproduction).
# When re-pinning, update snapshot + both filenames + both sha512s together.

# 2026-09-16: 20260524T170105Z rotated off the mirror (404). Re-pinned to the
# snapshot the laboratory bootstrapped from; both .DIGESTS verified against the
# Gentoo release key before the hashes below were copied.
