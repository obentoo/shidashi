# variants/arch/arrowlake/portage/make.conf — knobs de CPU do alvo Intel Arrow Lake (§9.3).
# Todos os controles andam juntos. SEM AVX-512 (§9.2) → GOAMD64 v3, nunca v4.
COMMON_FLAGS="-march=arrowlake -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

CHOST="x86_64-pc-linux-gnu"

CGO_CFLAGS="${CFLAGS}"
CGO_CXXFLAGS="${CXXFLAGS}"
CGO_FFLAGS="${FFLAGS}"
CGO_LDFLAGS="${LDFLAGS}"

GOAMD64="v3"
RUSTFLAGS="-C target-cpu=arrowlake -C link-arg=-fuse-ld=mold"

ABI_X86="64"

# Set manualmente por alvo (§9.3) — Arrow Lake NÃO tem AVX-512 (nenhum avx512*).
CPU_FLAGS_X86="aes avx avx2 f16c fma3 gfni mmx mmxext pclmul popcnt sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vaes vpclmulqdq"
