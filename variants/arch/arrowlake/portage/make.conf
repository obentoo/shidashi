# variants/arch/arrowlake/portage/make.conf — CPU knobs for the Intel Arrow Lake
# target (§9.3). All controls travel together. NO AVX-512 (§9.2), so GOAMD64 is
# v3 and never v4.
#
# This file is the SINGLE SOURCE for COMMON_FLAGS, GOAMD64, RUSTFLAGS and
# CPU_FLAGS_X86: recipe.yaml no longer repeats them, load_arch() reads them here.
COMMON_FLAGS="-march=arrowlake -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

CHOST="x86_64-pc-linux-gnu"

CGO_CFLAGS="${CFLAGS}"
CGO_CXXFLAGS="${CXXFLAGS}"
CGO_FFLAGS="${FFLAGS}"
CGO_LDFLAGS="${LDFLAGS}"

GOAMD64="v3"
# mold is deliberately NOT set here. A global "-C link-arg=-fuse-ld=mold" makes
# EVERY Rust compilation require sys-devel/mold to be installed; if it is not,
# every Rust package fails to link. Measured on the 682-package plan: mold is
# absent, and bindgen, cargo-c and librsvg all compile Rust. mold is a link-SPEED
# optimisation, not a correctness requirement — it can be enabled later, per
# package via package.env, once mold is guaranteed to be in the set.
RUSTFLAGS="-C target-cpu=arrowlake"

ABI_X86="64"

# Set per target by hand (§9.3) — NEVER from cpuid2cpuflags, which reads the
# build host (a Zen 5), not this target. Arrow Lake has NO AVX-512.
#
# This list is now COMPLETE and was derived from gcc-16.2.0 itself: every name
# below is one that `-march=arrowlake` actually enables (checked by diffing the
# compiler's predefined macros against profiles/desc/cpu_flags_x86.desc), and
# nothing that it enables is missing.
#
# Added avx_vnni and rdrand, which an earlier revision guessed at but left out.
#
# Removed gfni and vaes -- NOT because Arrow Lake lacks them. It has both (they
# are VEX-encoded 256-bit forms inherited from Alder Lake and do not need
# AVX-512; gcc defines __GFNI__ and __VAES__ for -march=arrowlake). They are
# simply not CPU_FLAGS_X86 names in Gentoo: neither appears among the 48 entries
# of profiles/desc/cpu_flags_x86.desc, and zero ebuilds declare that IUSE, so
# both were inert. Same for avx512vbmi2, which Gentoo spells avx512_vbmi2.
# (lab, F39)
CPU_FLAGS_X86="aes avx avx2 avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq"
