# variants/arch/arrowlake/recipe.yaml — Intel Arrow Lake (OVERVIEW §9.1/§9.2).
# Intel client moderno: SEM AVX-512 (removido desde Alder Lake) → JAMAIS v4;
# usa -march=arrowlake + GOAMD64 v3 (§9.2). Tier 2: o host AMD não roda ISA
# Intel-específica (SIGILL) → runnable_on_build_host: false; valida por QEMU TCG.
# cpu_flags_x86: AVX2-class + extensões client (vaes/gfni/sha), SEM nenhum avx512*.
arch: arrowlake
common_flags: "-march=arrowlake -O2 -pipe"
goamd64: v3
rustflags: "-C target-cpu=arrowlake -C link-arg=-fuse-ld=mold"
cpu_flags_x86: [aes, avx, avx2, f16c, fma3, gfni, mmx, mmxext, pclmul, popcnt,
                sha, sse, sse2, sse3, sse4_1, sse4_2, ssse3, vaes, vpclmulqdq]
runnable_on_build_host: false
tier: 2
