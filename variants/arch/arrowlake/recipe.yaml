# variants/arch/arrowlake/recipe.yaml — Intel Arrow Lake (OVERVIEW §9.1/§9.2).
# Modern Intel client silicon: NO AVX-512 (dropped since Alder Lake), so never
# v4 -- it uses -march=arrowlake with GOAMD64 v3 (§9.2). Tier 2 because this AMD
# build host cannot execute Intel-specific ISA (SIGILL), hence
# runnable_on_build_host: false; validation goes through QEMU TCG.
#
# The compile knobs are NOT here. COMMON_FLAGS, GOAMD64, RUSTFLAGS and
# CPU_FLAGS_X86 live in portage/make.conf, which is the file the build reads;
# load_arch() derives them from it. They used to be duplicated in this file and
# the two copies drifted apart without anything noticing.
arch: arrowlake
runnable_on_build_host: false
tier: 2
