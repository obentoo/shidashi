# variants/arch/v3/portage/make.conf — knobs de CPU do alvo baseline (OVERVIEW §9.3).
# Estes controles PRECISAM andar juntos (senão um Go/Rust v3 vaza num binpkg de
# outro alvo). Fatorado de common/make.conf (bloco de compiler-flags) e
# parametrizado para -march=x86-64-v3.
COMMON_FLAGS="-march=x86-64-v3 -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

CHOST="x86_64-pc-linux-gnu"

CGO_CFLAGS="${CFLAGS}"
CGO_CXXFLAGS="${CXXFLAGS}"
CGO_FFLAGS="${FFLAGS}"
CGO_LDFLAGS="${LDFLAGS}"

GOAMD64="v3"
# mold is deliberately NOT set here. A global "-C link-arg=-fuse-ld=mold" makes
# EVERY Rust compilation require sys-devel/mold to be installed; if it is not,
# every Rust package fails to link. Measured on the 682-package plan: mold is
# absent, and bindgen, cargo-c and librsvg all compile Rust. mold is a link-SPEED
# optimisation, not a correctness requirement — it can be enabled later, per
# package via package.env, once mold is guaranteed to be in the set.
RUSTFLAGS="-C target-cpu=x86-64-v3"

ABI_X86="64"

# Set manualmente por alvo (§9.3) — NÃO usar cpuid2cpuflags (detecta o host).
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt sse sse2 sse3 sse4_1 sse4_2 ssse3"
