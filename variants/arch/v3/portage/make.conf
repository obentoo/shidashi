# variants/arch/v3/portage/make.conf — CPU knobs for the baseline target
# (OVERVIEW §9.3). These controls MUST travel together: if they drift apart, a
# Go or Rust binary built for v3 can leak into another target's binpkg.
# Factored out of common/make.conf (the compiler-flags block) and parameterised
# for -march=x86-64-v3.
#
# This file is the SINGLE SOURCE for COMMON_FLAGS, GOAMD64, RUSTFLAGS and
# CPU_FLAGS_X86: recipe.yaml no longer repeats them, load_arch() reads them here.
COMMON_FLAGS="-march=x86-64-v3 -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

CHOST="x86_64-pc-linux-gnu"

CGO_CFLAGS="${CFLAGS}"
CGO_CXXFLAGS="${CXXFLAGS}"
CGO_FFLAGS="${FFLAGS}"
CGO_LDFLAGS="${LDFLAGS}"

GOAMD64="v3"
# mold is deliberately NOT set here. A global "-C link-arg=-fuse-ld=mold" makes
# EVERY Rust compilation require sys-devel/mold to be installed; if it is not,
# every Rust package fails to link. Measured on the 682-package plan: mold is
# absent, and bindgen, cargo-c and librsvg all compile Rust. mold is a link-SPEED
# optimisation, not a correctness requirement — it can be enabled later, per
# package via package.env, once mold is guaranteed to be in the set.
RUSTFLAGS="-C target-cpu=x86-64-v3"

ABI_X86="64"

# Set per target by hand (§9.3) — NEVER from cpuid2cpuflags, which reads the
# build host, not the target.
#
# WHAT THIS TARGET MEANS, stated because the name alone does not say it:
#
#     v3 = x86-64-v3 PLUS AES-NI and PCLMULQDQ
#        = Intel Skylake or AMD Excavator onwards, i.e. hardware from 2016+
#
# The psABI level x86-64-v3 mandates exactly AVX, AVX2, BMI1, BMI2, F16C, FMA,
# LZCNT, MOVBE and OSXSAVE. It does NOT include `aes` or `pclmul`; both are
# optional and require their own CPUID check. Verified with gcc-16.2.0:
# `-march=x86-64-v3` defines neither __AES__ nor __PCLMUL__.
#
# So the two are a DATE-BASED guarantee, not an ISA-level one, and the excluded
# case has a name: Core i3-4000M (Haswell, Q4'13) ships AVX2 and, per Intel ARK,
# "Intel AES New Instructions: No". A binpkg built with `aes` faults on it with
# SIGILL rather than merely running slower.
#
# The 2016 cut is what makes them safe, with a full generation of margin --
# Intel's segmentation of AES-NI on Core i3 parts did not survive Haswell.
# Checked against Intel ARK: i3-6100 and i3-6100U (Skylake, Q3'15), i3-7100
# (Kaby Lake, Q1'17) and N100 (Alder Lake-N, Q1'23) all list AVX2 AND AES-NI.
# On the AMD side there is no question at all: AES-NI predates v3 there, having
# shipped since Bulldozer (2011).
#
# Dropping `aes` and `pclmul` would widen the target back to every v3 CPU since
# 2013 at the cost of hardware crypto throughput (dm-crypt, TLS) on effectively
# all of it. That is the trade being made here, on purpose.
#
# bmi1/bmi2 are in the psABI list above and were simply missing (lab, F39).
CPU_FLAGS_X86="aes avx avx2 bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt sse sse2 sse3 sse4_1 sse4_2 ssse3"
