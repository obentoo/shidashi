# variants/arch/znver5/portage/make.conf — CPU knobs for the AMD Zen 5 target
# (§9.3). All controls travel together. Zen 5 has AVX-512, so it is a v4-class
# target with GOAMD64 v4.
#
# This file is the SINGLE SOURCE for COMMON_FLAGS, GOAMD64, RUSTFLAGS and
# CPU_FLAGS_X86: recipe.yaml no longer repeats them, load_arch() reads them here.
COMMON_FLAGS="-march=znver5 -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

CHOST="x86_64-pc-linux-gnu"

CGO_CFLAGS="${CFLAGS}"
CGO_CXXFLAGS="${CXXFLAGS}"
CGO_FFLAGS="${FFLAGS}"
CGO_LDFLAGS="${LDFLAGS}"

GOAMD64="v4"
# mold is deliberately NOT set here. A global "-C link-arg=-fuse-ld=mold" makes
# EVERY Rust compilation require sys-devel/mold to be installed; if it is not,
# every Rust package fails to link. Measured on the 682-package plan: mold is
# absent, and bindgen, cargo-c and librsvg all compile Rust. mold is a link-SPEED
# optimisation, not a correctness requirement — it can be enabled later, per
# package via package.env, once mold is guaranteed to be in the set.
RUSTFLAGS="-C target-cpu=znver5"

ABI_X86="64"

# Set per target by hand (§9.3) — the list describes the Zen 5 ISA, not this
# machine. The build host happens to BE a Zen 5 (Ryzen 9 9950X), so its
# cpuid2cpuflags output was used to CHECK the list, never to generate it; every
# name below was also verified against profiles/desc/cpu_flags_x86.desc.
#
# The previous list omitted the entire baseline that every Zen 5 part has, and
# that was not harmless: 22 packages in the image plan read cpu_flags_x86_sse2
# (openssl, mesa, webkit-gtk, libaom, nodejs, pixman, fftw, libsdl2/3 ...), 10
# read sse4_1 and 9 read mmx. None of them errors — each simply decides its build
# believing the machine cannot do what it plainly can.
#
# Removed three names that do not exist: avx512vbmi2 (Gentoo spells it
# avx512_vbmi2), gfni and vaes. Zero ebuilds declare any of the three as IUSE.
# (lab, F39)
CPU_FLAGS_X86="aes avx avx2 avx512_bf16 avx512_bitalg avx512_vbmi2 avx512_vnni avx512_vp2intersect avx512_vpopcntdq avx512bw avx512cd avx512dq avx512f avx512ifma avx512vbmi avx512vl avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"
