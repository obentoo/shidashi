# variants/arch/znver5/portage/make.conf — knobs de CPU do alvo AMD Zen 5 (§9.3).
# Todos os controles andam juntos. Zen 5 → AVX-512 (classe v4), GOAMD64 v4.
COMMON_FLAGS="-march=znver5 -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

CHOST="x86_64-pc-linux-gnu"

CGO_CFLAGS="${CFLAGS}"
CGO_CXXFLAGS="${CXXFLAGS}"
CGO_FFLAGS="${FFLAGS}"
CGO_LDFLAGS="${LDFLAGS}"

GOAMD64="v4"
RUSTFLAGS="-C target-cpu=znver5 -C link-arg=-fuse-ld=mold"

ABI_X86="64"

# Set manualmente por alvo (§9.3) — inclui a família AVX-512 do Zen 5.
CPU_FLAGS_X86="aes avx avx2 avx512f avx512bw avx512cd avx512dq avx512vl avx512vbmi avx512vbmi2 vaes vpclmulqdq gfni sha"
