# variants/base/base.yaml — BASE fragment of the recipe (R8.1).
#
# Profile anchor shared by EVERY flavor: no-multilib is the bentoo default
# (OVERVIEW §3/§14). The `init` axis appends /systemd (or nothing, for openrc);
# the flavor NEVER touches the profile -- the whole graphical layer comes from
# use_prefer + sets.
#
# The `sets` here are the ones inherited by any release, split by PURPOSE so that
# "what is base" is a question you can answer per set (2026-09-08):
#   core   what every image needs to boot, be administered and be repaired
#   apps   general-purpose applications -- the first set to question when trimming
#   devel  language toolchains, build tooling, containers/orchestration
#   virt   virtualization and Windows compatibility
# `graphics` is NOT here: it is declared by each graphical flavor, so that
# `minimal` stays console-only.
#
# The split was neutral by construction: union(core, apps, devel, virt) is exactly
# the old `bentoo-apps` (132 atoms, verified). Pruning comes next, with numbers
# from step12-kde-resolve.
#
# The phases below are the canonical build-in-phases list (OVERVIEW §6.4). The
# `desktop` phase MUST be named exactly that: merge() drops it when the flavor
# declares no sets (as `minimal` does) -- which is why `minimal` keeps `sets: []`
# instead of listing the system sets itself.
profile_base: default/linux/amd64/23.0/no-multilib
sets:
  - base
# Cada phase DECLARA os sets que instala (antes isso era adivinhado pelo nome da
# fase). `phase_target` intersecta com os sets da receita, então listar aqui um
# set que só alguns flavors declaram é seguro: quem não o declara, não o instala.
#   rebuild  -> @world, sempre (reconstrução do tronco)
#   desktop  -> @<flavor>, o set curado do flavor
phases:
  # The three TRUNK cuts live on `rebuild`, the phase that builds the trunk.
  # Until 2026-09-26 they sat on `graphics`: run_phase writes a phase's own
  # use_break before its emerge, so the trunk (`--emptytree @world`) would run
  # with no cut and stop on the first cycle -- and under `minimal`, `graphics`
  # has no target and is skipped BEFORE writing, so the cuts were never applied.
  # The lab never saw it: sync-lab-cfg.sh concatenates every phase's cuts into
  # one break-pass, applied before the trunk. The file persists through later
  # phases (a phase without cuts writes nothing); the settle-pass removes it.
  #
  # As três quebras do TRONCO, medidas no laboratório. Portage revela um ciclo
  # por vez, então elas foram descobertas em sequência:
  #   python[bluetooth] -> bluez[obex] -> libical[introspection]
  #                     -> gobject-introspection -> python
  #     corte: `bluetooth` do python é suporte no MÓDULO socket, não uma
  #     capacidade do sistema. As alternativas custam mais -- bluez[-obex] tira
  #     transferência de ficheiros (visível ao utilizador) e libical[-introspection]
  #     mexe numa flag que 373 ebuilds declaram.
  #   docutils -> pillow[truetype] -> harfbuzz -> glib -> docutils
  #     Portage ofereceu UM corte, portanto não há escolha a fazer.
  #   ffmpeg -> libsdl2 -> pipewire -> ffmpeg
  #     corte: pipewire[-ffmpeg], o mais barato dos três que o Portage oferece.
  #     O ebuild do pipewire diz que a flag "is only used for pw-cat" e passa
  #     -Dffmpeg=disabled porque o plugin SPA está morto a montante desde
  #     Maio de 2020. As alternativas custam mais: ffmpeg[-sdl] tira o comando
  #     ffplay -- e é INVÁLIDA sob kde, porque kde-apps/kdenlive depende de
  #     ffmpeg[sdl] -- e libsdl2[-pipewire] tira o backend PipeWire do SDL2.
  #
  # Um flavor ACRESCENTA a esta lista; já não a substitui.
  - { name: rebuild, packages: [], sets: [], use_break: [
        { atom: dev-lang/python, flag: bluetooth, enable: false },
        { atom: dev-python/pillow, flag: truetype, enable: false },
        { atom: media-video/pipewire, flag: ffmpeg, enable: false },
      ] }
  - { name: graphics, packages: [], sets: [gpu, extra-media], use_break: [] }
  - { name: desktop, packages: [], sets: [], use_break: [] }
  - { name: apps, packages: [], sets: [base, extra-system, extra-desktop, extra-dev, extra-virt, archive-nonfree], use_break: [] }
