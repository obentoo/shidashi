# variants/base/base.yaml — the BASE stage: the core every image is built on (D24).
#
#   base ─► minimal ─► desktop ─► <flavor>
#
# The only full rebuild (`--emptytree @world` + @base): the stage3 re-cooked once
# per arch x init for the microarchitecture and the language, and the fork point
# every other stage starts from. Its set content lives in variants/kits/ (D25);
# this file only chooses.
#
# Profile anchor shared by EVERY image: no-multilib is the bentoo default
# (OVERVIEW §3/§14). The `init` axis appends /systemd (or nothing, for openrc);
# no stage touches the profile.
profile_base: default/linux/amd64/23.0/no-multilib
stage: base
update: emptytree
sets:
  - base
# No trunk cuts (2026-09-27). The lab needed three, measured with the old
# configuration in which the base carried the graphical USE:
#   python[bluetooth] -> bluez[obex] -> libical[introspection]
#                     -> gobject-introspection -> python
#   docutils -> pillow[truetype] -> harfbuzz -> glib -> docutils
#   ffmpeg -> libsdl2 -> pipewire -> ffmpeg
# Since D24 step 3b `bluetooth`, `truetype`, ffmpeg and pipewire belong to the
# desktop stage, so none of these cycles forms in the trunk. Measured from a
# fresh stage3 with the pinned tree and NO cut: base 622 packages, minimal 723,
# rc=0, no cycle, python -bluetooth by configuration -- and the pipeline's first
# base build had the two remaining cuts in place without either changing a flag.
# The audio cut lives on desktop.yaml (F72); the other two did not return there
# when the desktop stage was resolved over the real minimal.
#
# A later stage declares its own cuts where its cycles form.
use_break: []
