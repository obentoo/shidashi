# variants/base/base.yaml — the BASE stage: the core every image is built on (D24).
#
#   base ─► minimal ─► desktop ─► <flavor>
#
# The only full rebuild (`--emptytree @world` + @base): the stage3 re-cooked once
# per arch x init for the microarchitecture and the language, and the fork point
# every other stage starts from. Its set content lives in variants/kits/ (D25);
# this file only chooses.
#
# Profile anchor shared by EVERY image: no-multilib is the bentoo default
# (OVERVIEW §3/§14). The `init` axis appends /systemd (or nothing, for openrc);
# no stage touches the profile.
profile_base: default/linux/amd64/23.0/no-multilib
stage: base
update: emptytree
sets:
  - base
# The TRUNK cuts -- they belong to the stage that builds the trunk, and
# last until the settle of the image. Until 2026-09-26 they sat on a phase named
# `graphics`: run_phase writes a phase's own use_break before its emerge, so the
# trunk would have run with no cut and stopped on the first cycle, and under
# `minimal` they were never applied at all. The lab never saw it because
# sync-lab-cfg.sh concatenates every phase's cuts into one break-pass.
#
# As três quebras do TRONCO, medidas no laboratório. Portage revela um ciclo
# por vez, então elas foram descobertas em sequência:
#   python[bluetooth] -> bluez[obex] -> libical[introspection]
#                     -> gobject-introspection -> python
#     corte: `bluetooth` do python é suporte no MÓDULO socket, não uma
#     capacidade do sistema. As alternativas custam mais -- bluez[-obex] tira
#     transferência de ficheiros (visível ao utilizador) e libical[-introspection]
#     mexe numa flag que 373 ebuilds declaram.
#   docutils -> pillow[truetype] -> harfbuzz -> glib -> docutils
#     Portage ofereceu UM corte, portanto não há escolha a fazer.
#
# The third lab cut, ffmpeg -> libsdl2 -> pipewire -> ffmpeg, moved to the
# desktop stage (F72, 2026-09-27): since D24 step 3b the trunk has no ffmpeg
# and no pipewire, so the cut did nothing here, and minimal's settle dropped it.
#
# A later stage ADDS its own cuts; it never replaces these.
use_break:
  - { atom: dev-lang/python, flag: bluetooth, enable: false }
  - { atom: dev-python/pillow, flag: truetype, enable: false }
