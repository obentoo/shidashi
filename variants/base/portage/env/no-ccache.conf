# ccache off for packages whose ebuild refuses to build with it.
#
# Not the toolchain's reason (toolchain.conf: GCC's stage comparison). These
# ebuilds die in pkg_pretend when FEATURES contains ccache -- and pkg_pretend runs
# for EVERY package of a merge before the first build, so one of them stops the
# whole stage. dev-java/openjdk ("FEATURES=ccache doesn't work with openjdk, bug
# #677876") stopped the kde flavor 34 s after it started (2026-09-27, F73).
FEATURES="-ccache"
