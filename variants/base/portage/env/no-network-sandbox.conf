# network-sandbox off for builds that talk to themselves over loopback.
#
# network-sandbox gives each build its own network namespace and brings `lo` up
# in it -- which needs CAP_NET_ADMIN, and systemd-nspawn does not grant it to a
# container that shares the host's network ("Unable to configure loopback
# interface: Operation not permitted" on every phase). Most builds never notice;
# a build that opens a localhost socket fails with "Network is unreachable".
# Granting CAP_NET_ADMIN to the container instead would let a build reconfigure
# the HOST's network, so the exception stays per package.
#
# dev-java/openjdk: its build runs a javac server and connects to it over
# localhost; after 10 attempts it gives up and BUILD_TOOLS_JDK fails (kde run,
# 2026-09-28, after 745 of 856 packages; F74).
FEATURES="-network-sandbox"
