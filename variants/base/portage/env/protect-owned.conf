# protect-owned instead of collision-protect, for app-alternatives/* only.
#
# The base keeps collision-protect (F43): any file collision aborts a merge.
# One Gentoo pattern needs the default protect-owned instead. A provider such
# as app-arch/cpio creates the alternative's symlink UNOWNED in its
# pkg_postinst ("Ensure to preserve the symlink before app-alternatives/cpio":
# `ln -s gcpio /bin/cpio`), and app-alternatives/cpio then installs that same
# path. protect-owned lets it take over an unowned file; collision-protect
# refuses, and the first pipeline run stopped there (2026-09-26, F71).
# gzip, tar, bzip2 and awk follow the same pattern; they only passed because
# the stage3 already had their app-alternatives package installed.
FEATURES="-collision-protect protect-owned"
