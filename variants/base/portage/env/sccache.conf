# sccache for Rust packages. Applied per-package via package.env, NEVER globally.
#
# Why not global: RUSTC_WRAPPER is read by cargo for every Rust compilation. If
# it points at a binary that is not installed, the build fails. Measured: with
# RUSTC_WRAPPER set in make.conf and dev-util/sccache absent from the package
# set, dev-util/bindgen, dev-util/cargo-c and gnome-base/librsvg would all break
# mid-build.
#
# ccache is turned off here because sccache replaces it for this compiler.
FEATURES="-ccache"
RUSTC_WRAPPER="/usr/bin/sccache"
SCCACHE_CONF="/etc/sccache/config"
SCCACHE_DIR="/var/cache/sccache"
SCCACHE_MAX_FRAME_LENGTH="104857600"
SCCACHE_CACHE_SIZE="16G"
SCCACHE_SERVER_PORT="4226"
