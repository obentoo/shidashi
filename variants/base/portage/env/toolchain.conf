# ccache off for the toolchain (D7/D10).
#
# GCC bootstraps itself in three stages and compares stage2 against stage3 byte
# for byte. Any cache non-determinism aborts that comparison and the build fails.
# This is a per-package property, not a phase property, which is why it lives in
# package.env rather than in a phase fragment.
FEATURES="-ccache"
