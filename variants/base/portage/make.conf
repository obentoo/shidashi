# Bentoo Linux - Base make.conf
# https://github.com/lucascouts/bentoo
#
# This is the base configuration for all Bentoo editions.
# Edition-specific settings (DESKTOPS, etc.) are in editions/<name>/etc/portage/make.conf
#
# --- FACTORED OUT (Shidashi variants/, see OVERVIEW §15) -----------------------
# Moved to variants/arch/<x>/portage/make.conf (per-CPU, must travel together):
#   COMMON_FLAGS, CFLAGS, CXXFLAGS, FCFLAGS, FFLAGS, CGO_*, CHOST,
#   CPU_FLAGS_X86, ABI_X86.
# Moved to variants/init/systemd/portage/ :
#   the SYSTEMD="boot uki ukify" group and its ${SYSTEMD} entry in USE.
# Set per-flavor in variants/flavor/<y>/portage/make.conf :
#   DESKTOPS (kept empty here; the flavor populates it).
# ---------------------------------------------------------------------------

LC_MESSAGES=C.utf8

ACCEPT_KEYWORDS="~amd64"
ACCEPT_LICENSE="*"

FEATURES="buildpkg candy ccache collision-protect compressdebug -getbinpkg network-sandbox parallel-fetch parallel-install preserve-libs protect-owned sandbox compress-build-logs userfetch usersandbox usersync fixlafiles unmerge-orphans -binpkg-request-signature userpriv fail-clean"
AUTOCLEAN="yes"
L10N="ar be bg bs ca cs da de de-AT de-CH de_DE el en en-AU en-CA en-GB en-US en-ZA es es-419 es-AR es-CL es-ES es-MX es-PE et fa fi fil fr fr-CA ga he hi hr hu hy id it ja kk ko lb lt lv mg mi mk ml mn nb nl nn pl pt pt-BR pt-PT ro ru si sk sl sq sr sv ta th tl tr uk ur vi wa zh zh-CN zh-HK zh-TW zh_TW"
INPUT_DEVICES="evdev joystick libinput synaptics vmmouse wacom"
VIDEO_CARDS="amdgpu d3d12 fbdev intel nvidia qxl radeonsi vc4 virgl virtualbox"
ALSA_CARDS="hda-intel"
LLVM_TARGETS="AMDGPU BPF NVPTX"
LLVM_SLOT="21"
BINPKG_COMPRESS="zstd"
BINPKG_COMPRESS_FLAGS="-9"
CURL_SSL="openssl"
LUA_SINGLE_TARGET="lua5-4"
BINPKG_FORMAT="gpkg"
MAKEOPTS="-j$(nproc) -l$(nproc)"

CORE="acl caps cryptsetup dbus device-mapper introspection lvm pcre16 pcre32 python threads truetype udev xattr xcb xkb"
KERNEL="dist-kernel"
COMPRESSOR="lzma lz4 lzo zstd"
GRAPHICS="X cairo corefonts egl glamor gles gles1 gles2 opengl vaapi vdpau vulkan xa xinerama xvmc wayland"
DEVELOPMENT="clang git llvm lld"
PERFORMANCE="jit openmp native-extensions"
FILESYSTEM="btrfs"
IMAGE="avif heif jpegxl raw webp"
AUDIO="alsa jack libsamplerate pulseaudio pipewire screencast sdl sound-server"
VIDEO="ffmpeg nvenc x265"
NETWORK="ipv6 networkmanager"
DEVICES="bluetooth gphoto2 lm-sensors usb"
SECURITY="nss seccomp"
VIRTUALIZATION="kvm qemu virt-network virtfs spice usbredir"
REMOVED="-doc -gnome -gnome-keyring -gnome-online-accounts -handbook -telemetry -webengine -webkit"

# DESKTOPS is set per-edition (see editions/<name>/etc/portage/make.conf)
DESKTOPS=""

USE="
 ${CORE}\
 ${KERNEL}\
 ${COMPRESSOR}\
 ${GRAPHICS}\
 ${DEVELOPMENT}\
 ${PERFORMANCE}\
 ${FILESYSTEM}\
 ${IMAGE}\
 ${AUDIO}\
 ${VIDEO}\
 ${NETWORK}\
 ${DEVICES}\
 ${SECURITY}\
 ${DESKTOPS}\
 ${VIRTUALIZATION}\
 ${REMOVED}
"

DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"
PORTAGE_TMPDIR="/var/tmp"
QEMU_USER_TARGETS="aarch64 arm i386 x86_64"
SANE_BACKENDS="*"

CCACHE_DIR="/var/cache/ccache"
CCACHE_SIZE="10G"

SCCACHE_CONF="/etc/sccache/config"
RUSTC_WRAPPER="/usr/bin/sccache"
SCCACHE_DIR="/var/cache/sccache"
SCCACHE_MAX_FRAME_LENGTH="104857600"
SCCACHE_CACHE_SIZE="10G"
SCCACHE_SERVER_PORT="4226"
SANDBOX_WRITE="/var/cache/sccache/"
