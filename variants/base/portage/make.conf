# Bentoo Linux - Base make.conf
# https://github.com/obentoo/bentoo
#
# This is the base configuration for all Bentoo editions.
# Flavor-specific settings (DESKTOPS, etc.) are in variants/flavor/<y>/portage/make.conf
#
# --- FACTORED OUT (Shidashi variants/, see OVERVIEW §15) -----------------------
# Moved to variants/arch/<x>/portage/make.conf (per-CPU, must travel together):
#   COMMON_FLAGS, CFLAGS, CXXFLAGS, FCFLAGS, FFLAGS, CGO_*, CHOST,
#   CPU_FLAGS_X86, ABI_X86.
# Moved to variants/init/systemd/portage/ :
#   the SYSTEMD="boot uki ukify" group and its ${SYSTEMD} entry in USE.
# Set per-flavor in variants/flavor/<y>/portage/make.conf :
#   DESKTOPS, which the flavor APPENDS to USE itself — this file has no slot
#   for it (see the note above the USE block).
# ---------------------------------------------------------------------------

LC_MESSAGES=C.utf8

ACCEPT_KEYWORDS="~amd64"
ACCEPT_LICENSE="*"

# ccache/buildpkg are OFF here on purpose (D7). Bootstrap steps would cache and
# package binaries that step 9 discards anyway, and ccache actively BREAKS the
# gcc build (D10): gcc bootstraps itself three times and compares stage2 against
# stage3 byte for byte, so cache non-determinism aborts the build. The `world`
# step turns both ON — that is where the definitive binpkgs are produced.
FEATURES="-buildpkg candy -ccache collision-protect compressdebug -getbinpkg network-sandbox parallel-fetch parallel-install preserve-libs sandbox compress-build-logs userfetch usersandbox usersync fixlafiles unmerge-orphans -binpkg-request-signature userpriv fail-clean"
AUTOCLEAN="yes"
L10N="ar be bg bs ca cs da de de-AT de-CH el en en-AU en-CA en-GB en-US en-ZA es es-419 es-AR es-CL es-ES es-MX es-PE et fa fi fil fr fr-CA ga he hi hr hu hy id it ja kk ko lb lt lv mg mi mk ml mn nb nl nn pl pt pt-BR pt-PT ro ru si sk sl sq sr sv ta th tl tr uk ur vi wa zh zh-CN zh-HK zh-TW"
INPUT_DEVICES="evdev joystick libinput vmmouse wacom"
# VIDEO_CARDS lives in package.use/00video_cards, which prefixes the list with
# "-*" to clear the profile defaults first (nouveau, vesa, dummy, radeon).
# Setting it here would NOT clear them, and those drivers would be built.
# ALSA_CARDS: "hda-intel" is NOT an accepted value (see profiles/desc/alsa_cards.desc).
# Intel HDA is built into the kernel and needs no USE flag. Set a value here only
# if a specific card (emu10k1, ice1712, hdspm, ...) must be supported.
#ALSA_CARDS=""
LLVM_TARGETS="AMDGPU BPF NVPTX"
# LLVM_SLOT stays at 21. Raising it to 22 was tried in the lab and does NOT work:
# sys-block/thin-provisioning-tools-1.3.1 declares LLVM_COMPAT=( {19..21} ) and no
# version in ::gentoo goes past 21 (1.3.0 is {17..20}), so the graph stops dead on
# REQUIRED_USE exactly-one-of. It is reached through a chain nothing can opt out
# of: passwdqc -> pam -> pambase[systemd] -> systemd[cryptsetup] -> cryptsetup ->
# lvm2[lvm,thin] -> thin-provisioning-tools.
#
# Raising it would also not save a build. THREE llvm+clang slots are built either
# way, because two packages pin 21 independently of this default
# (thin-provisioning-tools, and dev-lang/rust-bin-1.94.1 with LLVM_COMPAT=( 21 )),
# mesa/mesa_clc/spirv-llvm-translator/libclc pin 22, and the slotless llvm-common,
# clang-common, llvmgold and clang-runtime follow ::gentoo's current default, 23.
# Cutting a slot means removing CONSUMERS, not changing this line (lab, 2026-08-30).
LLVM_SLOT="21"
BINPKG_COMPRESS="zstd"
BINPKG_COMPRESS_FLAGS="-9"
CURL_SSL="openssl"
LUA_SINGLE_TARGET="lua5-4"
# python3_14 only. 3.13 was dropped deliberately; 3.15 is not a candidate yet
# (::gentoo has only _beta/_rc builds of it).
#
# The two variables must AGREE. Carrying python3_13 in TARGETS while
# SINGLE_TARGET named it too was survivable; the failure mode is when they
# disagree — sys-apps/systemd saw two targets and failed REQUIRED_USE
# exactly-one-of during the first host pilot.
PYTHON_TARGETS="python3_14"
PYTHON_SINGLE_TARGET="python3_14"
RUBY_TARGETS="ruby34 ruby40"
PHP_TARGETS="php8-5"
BINPKG_FORMAT="gpkg"
# MAKEOPTS must be LITERAL: Portage does not run command substitution on
# make.conf, so "-j$(nproc)" resolves to an EMPTY string and the build goes
# serial. Measured in the lab: with a literal value portageq reports it back
# correctly. TODO: this value is host-specific and belongs in the recipe, not
# here — Shidashi should inject it per build host.
MAKEOPTS="-j32 -l32"

# acl, ipv6, openmp, seccomp, udev and xattr are NOT listed in the groups below.
# Measured with an empty make.conf against this same profile: all six are already
# in the profile's 154 default flags, so declaring them changed nothing (F16).
#
# The trade-off, stated so it is a choice and not an accident: the recipe now
# INHERITS them. If a future profile bump drops one, this file will not notice.
# Re-add any of them here the moment it must be guaranteed regardless of profile.
CORE="caps cryptsetup dbus device-mapper introspection lvm pcre16 pcre32 python threads truetype xcb xkb"
KERNEL="dist-kernel"
COMPRESSOR="lzma lz4 lzo zstd"
GRAPHICS="X cairo corefonts egl gles gles1 gles2 opengl vaapi vdpau vulkan xinerama xvmc wayland"
DEVELOPMENT="clang git llvm lld"
PERFORMANCE="jit native-extensions"
FILESYSTEM="btrfs"
IMAGE="avif heif jpegxl raw webp"
AUDIO="alsa jack libsamplerate pulseaudio pipewire screencast sdl sound-server"
VIDEO="dav1d ffmpeg nvenc x265"
NETWORK="networkmanager"
DEVICES="bluetooth gphoto2 lm-sensors usb"
# secureboot/modules-sign: signed kernel modules and Secure Boot support. Planned
# as an OPTIONAL path in the ISO for the user; the flags belong here now so the
# packages are built capable of it.
SECURITY="modules-sign nss secureboot"
VIRTUALIZATION="qemu virt-network virtfs spice usbredir"
REMOVED="-doc -gnome -gnome-keyring -gnome-online-accounts -handbook -telemetry -webengine -webkit"

# No DESKTOPS slot here. A flavor cannot fill one: apply_portage concatenates
# the layer make.conf files, so this USE block is already expanded by the time
# a flavor fragment is read. Flavors therefore APPEND — see
# variants/flavor/kde/portage/make.conf, which ends in USE="${USE} ${DESKTOPS}".

USE="
 ${CORE}\
 ${KERNEL}\
 ${COMPRESSOR}\
 ${GRAPHICS}\
 ${DEVELOPMENT}\
 ${PERFORMANCE}\
 ${FILESYSTEM}\
 ${IMAGE}\
 ${AUDIO}\
 ${VIDEO}\
 ${NETWORK}\
 ${DEVICES}\
 ${SECURITY}\
 ${VIRTUALIZATION}\
 ${REMOVED}
"

DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"
PORTAGE_TMPDIR="/var/tmp"

# Build priority: keep the machine usable while emerge runs. Recovered from the
# host make.conf, where it was lost during the variants/ factoring.
PORTAGE_NICENESS="5"
PORTAGE_IONICE_COMMAND="ionice -c3 -p \${PID}"
PORTAGE_SCHEDULING_POLICY="idle"
QEMU_USER_TARGETS="aarch64 arm i386 x86_64"
# No SANE_BACKENDS. The value used to be "*", which is not a flag name:
# media-gfx/sane-backends builds its IUSE as sane_backends_<name>, so "*" set a
# flag literally called sane_backends_*, which no ebuild declares — the intent
# ("all backends") never happened and the ebuild's own defaults applied. The
# package is not in any set either. Enabling scanner support means adding it to
# a set AND listing real backend names here (lab, 2026-09-01, F42).

CCACHE_DIR="/var/cache/ccache"
CCACHE_SIZE="32G"

# sccache moved to env/sccache.conf + package.env/sccache.
#
# RUSTC_WRAPPER must NEVER be global: cargo reads it for every Rust compilation,
# so if it points at a binary that is not installed the build fails. Measured on
# the 682-package plan: dev-util/bindgen, dev-util/cargo-c and gnome-base/librsvg
# compile Rust, and dev-util/sccache is not in the set.
#
# ccache stays global here because FEATURES governs it, and package.env/toolchain
# switches it off for the compilers that cannot tolerate it.
