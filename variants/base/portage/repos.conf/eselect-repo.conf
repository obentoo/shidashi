# Repositories this project builds from. Only these two: every package in every
# variants/*/sets/* resolves from ::gentoo or ::bentoo alone (verified 2026-08-31).
#
# guru, torbrowser and librewolf used to be declared here and were removed. They
# were not merely unused — resolve.bind_repos() raises ResolveError for a repo
# named here whose /var/db/repos/<name> does not exist on the build host, so
# declaring a repository nobody clones makes `shidashi factory` abort before it
# builds anything (F25).
#
# Adding one back means BOTH: a stanza here AND the repository present on the
# build host (`eselect repository add <name> git <uri>` + `emerge --sync <name>`).

[gentoo]
location = /var/db/repos/gentoo
sync-type = git
sync-uri = https://github.com/gentoo-mirror/gentoo.git

[bentoo]
location = /var/db/repos/bentoo
sync-type = git
sync-uri = https://github.com/obentoo/bentoo.git
