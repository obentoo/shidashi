# variants/base/system.yaml — how every image is CONFIGURED, beyond the packages it has.
#
# The Handbook's "Configuring the system", "Installing tools" and "Finalizing"
# chapters as data (https://wiki.gentoo.org/wiki/Handbook:AMD64). The first ISO
# booted to a text login nobody could use: the pipeline installed packages and
# configured nothing -- no service enabled, no hostname, no account (F79).
#
# Applied by the assembler to the image's rootfs, checked right after (a missing
# link or file fails the build), and recorded in the run's audit trail. Every
# layer of a recipe may carry a system.yaml: scalars override the earlier layer,
# lists add to it (a flavor adds its display manager to the init's services).
# What only the live medium does is in variants/livecd.yaml.

# Handbook › System › Hostname. /etc/hostname, plus the name in /etc/hosts.
hostname: bentoo

# Handbook › Base › Locale: `eselect locale set` (writes /etc/locale.conf and
# env.d). Must be one of the generated locales of base/rootfs/etc/locale.gen.
locale: en_US.UTF-8

# Handbook › System › Init configuration: the console keymap
# (/etc/vconsole.conf under systemd, /etc/conf.d/keymaps under OpenRC).
keymap: us

# Handbook › Base › Timezone. UTC on the medium; the installer sets the user's.
# Explicit because systemd-nspawn otherwise copies the BUILD HOST's zone into the
# image (--timezone=auto): the first ISO shipped America/Sao_Paulo that way.
timezone: UTC

# /etc/os-release: who the system says it is (os-release(5)). Written as a real
# file in /etc, which takes precedence over baselayout's /usr/lib/os-release and
# which Portage's CONFIG_PROTECT keeps across updates. ID_LIKE keeps tools that
# look for Gentoo working. The assembler adds the build's own fields: VERSION,
# VERSION_ID, BUILD_ID, IMAGE_ID, IMAGE_VERSION, VARIANT, VARIANT_ID. The first
# ISO said "Welcome to the Gentoo operating system" in KDE's Welcome Center.
os_release:
  NAME: Bentoo
  ID: bentoo
  ID_LIKE: gentoo
  PRETTY_NAME: Bentoo Linux
  HOME_URL: https://github.com/obentoo/bentoo
  BUG_REPORT_URL: https://github.com/obentoo/bentoo/issues
  ANSI_COLOR: "1;35"

# Handbook › Finalizing › "wheel" group with sudo: /etc/sudoers.d/10-wheel.
# Gentoo's sudoers-rs ships the rule commented and includes /etc/sudoers.d.
sudo_wheel: true

# The services to enable live in the init layer (init/systemd/system.yaml,
# init/openrc/system.yaml): which units exist and how they start depend on the
# init, and the stages stay init-neutral (2026-10-01).
