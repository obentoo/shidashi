# variants/desktop/portage/make.conf — the graphical configuration of the DESKTOP
# stage (D24): Wayland as server and compositor, no X session. Moved here from the
# base on 2026-09-26. It enters the build at the desktop stage, over the settled
# minimal image, and `emerge -uDN @world` rebuilds only what these flags change.
#
# apply_portage concatenates the layers' make.conf, so the base's USE is already
# expanded here and this fragment APPENDS to it. The base's -X stays in force:
# nothing here turns X back on, and XWayland arrives only as a compatibility
# dependency of the compositors.
#
# Dropped rather than moved: `xcb`, `xinerama` and `vdpau` (X-only) and `X` itself.

# vdpau is NOT here: VDPAU is an X11 API (NVIDIA's legacy decoder) and every
# consumer requires X for it -- REQUIRED_USE "vdpau? ( X )" in mpv and vlc. On
# Wayland, hardware video decoding is VA-API and Vulkan Video.
GRAPHICS="wayland cairo egl gles2 opengl vaapi vulkan truetype xkb"
IMAGE="avif heif jpegxl raw webp"
AUDIO_GRAPHICAL="jack libsamplerate pulseaudio pipewire screencast sdl"
VIDEO="dav1d ffmpeg nvenc x265"
DEVICES_GRAPHICAL="bluetooth gphoto2"

USE="${USE} ${GRAPHICS} ${IMAGE} ${AUDIO_GRAPHICAL} ${VIDEO} ${DEVICES_GRAPHICAL}"

# X/Wayland input drivers (libinput is what Wayland compositors use).
INPUT_DEVICES="evdev joystick libinput vmmouse wacom"
