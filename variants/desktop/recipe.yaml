# variants/desktop/recipe.yaml — the DESKTOP stage (D24): the graphical
# infrastructure shared by every graphical flavor, and no applications.
#
# Built over the settled minimal with `emerge -uDN @world`: only what the
# graphical USE changes is rebuilt, once for all four flavors. Its fork point is
# where kde, gnome and wm branch.
#
# Deliberately thin today (step 2 of D24 is neutral): it installs @gpu, which the
# old `graphics` phase did, and has no portage/ yet. Step 3 moves the graphical
# USE here from the base -- Wayland as server and compositor, no X session
# (`-X wayland`; XWayland and legacy X libraries stay only as compatibility) --
# together with the infrastructure sets: fonts, portals, the audio server, and
# @vpn @print @sandbox as system services.
stage: desktop
after: minimal
# The graphical infrastructure (D24): drivers and their tools, fonts, portals
# and desktop integration, the audio server, and the system services a
# graphical session uses -- NetworkManager's VPN plugins, CUPS, flatpak.
sets:
  - gpu
  - gpu-nvidia
  - fonts
  - desktop-int
  - audio
  - video
  - vpn
  - print
  - sandbox
# The audio cycle forms HERE, where the graphical USE (ffmpeg, sdl) and the
# audio server arrive (F72). Measured on 2026-09-27 by resolving this stage with
# -uDN over the real vdb of a built minimal, with no cut pending:
#   ffmpeg -> libsdl2 -> pipewire -> ffmpeg
# Cut: pipewire[-ffmpeg], the cheapest of the three Portage offers. The ebuild
# says the flag "is only used for pw-cat" and passes -Dffmpeg=disabled because
# the SPA plugin has been dead upstream since May 2020. The alternatives cost
# more: ffmpeg[-sdl] drops ffplay -- and is INVALID under kde, where
# kde-apps/kdenlive needs ffmpeg[sdl] -- and libsdl2[-pipewire] drops SDL2's
# PipeWire backend. Pending until the settle of the next shipped image (the
# flavor), which rebuilds pipewire with ffmpeg.
use_break:
  - { atom: media-video/pipewire, flag: ffmpeg, enable: false }
# No exclude of its own: gentoo-kernel and fuse (base) and bleachbit (minimal)
# are excluded by earlier stages, whose exclude reaches every later one.
include:
  - sys-apps/bleachbit
