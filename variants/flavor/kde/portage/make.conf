# variants/flavor/kde/portage/make.conf — the KDE graphical layer (OVERVIEW §15).
# Factored from editions/plasma/etc/portage/make.conf. apply_portage concatenates
# the layer make.conf files, so this fragment is appended AFTER base's.
DESKTOPS="kde qt6 plymouth semantic-desktop"

# The group is named for readability, but the USE line is what carries it.
# Relying on base expanding ${DESKTOPS} could never work: apply_portage
# concatenates the layers, so base's USE block is evaluated BEFORE this file
# is read, with DESKTOPS still empty (F28).
USE="${USE} ${DESKTOPS}"
