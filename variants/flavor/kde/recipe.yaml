# variants/flavor/kde/recipe.yaml — KDE Plasma flavor (OVERVIEW §8/§14).
# No desktop-specific profile: the anchor is just no-multilib[/systemd], and the
# "KDE layer" is built from use_prefer + portage/package.use + sets (§14,
# "Profile resolution").
# `sets: [kde]` -- `graphics` already comes from base, and merge() takes the
# ordered union, so repeating it here would be redundant.
# override_ok: false -- KDE is curated and authoritative (§14).
flavor: kde
use_prefer:
  add:  [qt6, kde, wayland]
  drop: [gtk, gnome, webkit]
sets:
  - extra-system
  - extra-desktop
  - extra-media
  - extra-dev
  - extra-virt
  - gpu
  - kde
override_ok: false
# No use_break here. All three trunk cycles are cut in base.yaml, and merge()
# now ACCUMULATES base + flavor instead of replacing, so this flavor would only
# declare a cut of its OWN. It once declared media-video/ffmpeg[-sdl] -- copied
# from what works for minimal -- which is invalid here, because kde-apps/kdenlive
# depends on ffmpeg[sdl]. The base cuts the same cycle at pipewire[-ffmpeg],
# which is valid for every flavor (lab, 2026-09-13).
