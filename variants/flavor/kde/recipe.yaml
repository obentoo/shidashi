# variants/flavor/kde/recipe.yaml — KDE Plasma flavor (OVERVIEW §8/§14).
# No desktop-specific profile: the anchor is just no-multilib[/systemd], and the
# "KDE layer" is built from use_prefer + portage/package.use + sets (§14,
# "Profile resolution").
# `sets: [kde]` -- `graphics` already comes from base, and merge() takes the
# ordered union, so repeating it here would be redundant.
# override_ok: false -- KDE is curated and authoritative (§14).
flavor: kde
use_prefer:
  add:  [qt6, kde, wayland]
  drop: [gtk, gnome, webkit]
sets:
  - extra-system
  - extra-desktop
  - extra-media
  - extra-dev
  - extra-virt
  - gpu
  - kde
override_ok: false
# Curated cycle break (§18.7): during the break-pass of the `graphics` phase,
# force media-video/pipewire[-ffmpeg] OFF to break
#     ffmpeg -> libsdl2 -> pipewire -> ffmpeg
#
# It used to break the cycle at media-video/ffmpeg[-sdl], which is what the
# `minimal` flavor still uses. That choice is INVALID here: kde-apps/kdenlive
# depends on ffmpeg[sdl], so step12-kde-resolve rejected it. This is precisely
# why use_break is curated per flavor -- the same cycle, a different valid cut.
#
# pipewire[ffmpeg] is also the cheapest of the three cuts Portage offers. Its own
# ebuild says the flag "is only used for pw-cat" and passes -Dffmpeg=disabled
# because the SPA plugin has been dead upstream since May 2020. The alternatives
# cost more: ffmpeg[-sdl] drops the ffplay command, and libsdl2[-pipewire] takes
# the PipeWire backend away from SDL2. Nothing in the plan requires either
# (lab, 2026-09-13).
use_break:
  graphics:
    - { atom: media-video/pipewire, flag: ffmpeg, enable: false }
