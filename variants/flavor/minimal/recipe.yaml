# variants/flavor/minimal/recipe.yaml — console-only, no graphical environment
# (OVERVIEW §8/§14). A base stage4 in the Arch / Debian-netinst mould: TTY only,
# no compositor. It is the pilot's control case and is essentially the trunk of
# the fork-point.
# sets: [] -- no desktop set, it consumes only the base ones. Because sets is
# empty, merge() OMITS the `desktop` phase.
# override_ok: true -- an open flavor: later layers may adjust the USE.
flavor: minimal
use_prefer:
  drop: [qt6, kde, gnome, gtk]
sets:
  - extra-system
override_ok: true
