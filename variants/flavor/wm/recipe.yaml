# variants/flavor/wm/recipe.yaml — Wayland-only window managers (OVERVIEW §8): Hyprland (default), Sway, niri.
# A stage of the chain, after desktop (D24): base ─► minimal ─► desktop ─► wm.
# sets: [wm] -- a placeholder set, to be curated via pretend-resolve (§18.7).
#
# USE: none of its own. The former `use_prefer` (F69) asked for wayland, which
# the desktop stage already sets, and dropped qt6/gnome/kde, which no shared
# stage enables -- so a make.conf here would configure nothing (D24 step 3c).
stage: wm
after: desktop
ships: true
sets:
  - wm
  - extra-desktop
  - extra-media
  - extra-dev
  - extra-virt
