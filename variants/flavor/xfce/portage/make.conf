# variants/flavor/xfce/portage/make.conf — the XFCE layer's USE (D24 step 3c).
# Written from the intent its recipe.yaml recorded when `use_prefer` was removed
# (F69: it never reached a build). apply_portage concatenates the layer make.conf
# files, so this fragment APPENDS to the USE already expanded by base and desktop.
#
# Only the positive half of the intent is here. Its drops (qt6, gnome) are already
# off: no shared stage enables them, and the base forces -gnome.
DESKTOPS="gtk"

USE="${USE} ${DESKTOPS}"
