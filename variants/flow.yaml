# variants/flow.yaml — what a build does, phase by phase, step by step.
#
# The engine (shidashi/) knows the step KINDS; the order, the packages and the
# parameters are here. Edit this file to change the process. Each `do:` is one
# kind, documented in shidashi/flow.py; `name` is what logs and errors show
# (a failure reads "bootstrap:<name>").
#
# Order of a build (the parts not yet in this file are in shidashi/factory.py):
#   seed (verified stage3) → layers' rootfs/ + portage/ → BOOTSTRAP (below) →
#   bootstrap checkpoint → generation fingerprint → the stage chain
#   (variants/base → minimal → desktop → flavor: sets, cuts, fork points).

# --- bootstrap -------------------------------------------------------------------
# Brings the stage3's toolchain to the pinned tree's versions before the base
# rebuilds everything with --emptytree -- otherwise the whole image would be built
# by the stage3's own gcc. Runs only over a fresh stage3; a build that restores a
# checkpoint or a stage fork point skips it. (BOOTSTRAP-PROCESS.md §1, D22.)
bootstrap:
  # buildpkg and ccache are ON in the base make.conf for the world build; only
  # the environment turns them off without touching package.env (F65).
  env:
    FEATURES: "-buildpkg -ccache"
  steps:
    # 0 -- locales from the curated /etc/locale.gen, selected BY NAME: indices
    #      shift between runs (F9); the spelling must match locale.gen exactly.
    - {name: locale, do: locale, locale: en_US.UTF-8}

    # 1 -- kernel headers and binutils, then the newest binutils.
    - {name: binutils, do: emerge, atoms: [sys-kernel/linux-headers, sys-devel/binutils]}
    - {name: binutils, do: select-toolchain, tool: binutils}

    # 2 -- gcc lands in a NEW slot; merging does not switch to it (F8).
    - {name: gcc, do: emerge, atoms: [sys-devel/gcc]}
    - {name: gcc, do: select-toolchain, tool: gcc}

    # 3 -- libtool, rebuilt against the new gcc. (The category moved: dev-build.)
    - {name: libtool, do: emerge, atoms: [dev-build/libtool]}

    # 4 -- glibc is built -compile-locales: an upgrade can silently shrink
    #      `locale -a`. The step counts before and after and fails if it dropped.
    - {name: glibc, do: emerge, atoms: [sys-libs/glibc], keep_locales: true}

    # 5 -- whatever still links against a replaced library.
    - {name: preserved, do: emerge, atoms: ["@preserved-rebuild"]}

    # G -- the toolchain is final: record or verify the generation fingerprint
    #      of the PKGDIR (D26) before anything below writes a binpkg into it.
    - {name: generation, do: check-generation}

    # P -- the ccache binary, while FEATURES still says -ccache (the base turns
    #      it on next). Unlike the toolchain it is built WITH buildpkg: it is
    #      built by the final toolchain, and no later stage rebuilds it -- the
    #      base's --emptytree does not reach it, and @devel finds it installed.
    #      Without its binpkgs (and its deps') the ISO cannot install @devel.
    - name: ccache
      do: emerge
      atoms: [dev-util/ccache]
      env: {FEATURES: "-ccache"}

    # Every step above is --oneshot: anything in the world file would be rebuilt
    # by the base and shipped.
    - {name: world, do: assert-world-empty}

# --- stages ---------------------------------------------------------------------
# What EVERY stage of the chain does -- base → minimal → desktop → <flavor>, as
# declared by variants/base/base.yaml, minimal/, desktop/ and flavor/<f>/ -- in
# this order. Which sets it installs and which cycle cuts it declares come from
# the stage's own YAML; how it emerges comes from here.
stages:
  emerge:
    options: [--verbose, --usepkg]        # --usepkg: the generation's binpkgs (D26)
    rebuild: [--emptytree]                 # the stage with `update: emptytree` (base)
    update: [--update, --deep, --newuse]   # every later stage
    world: true                            # -uDN @world @<sets>: USE changes reach
                                           # packages outside the new sets (792f565)
  settle:
    options: [--verbose, --newuse, --oneshot]
  steps:
    # before the emerge
    - {name: config, do: apply-config}     # layers up to this stage + quirks.yaml
    - {name: cuts, do: write-cuts}         # this stage's use_break → package.use
    - {name: emerge, do: emerge-stage}
    # after the emerge
    - {name: settle, do: settle}           # only where the stage `ships`: undo the
                                           # cuts pending since the last settle, on
                                           # the packages that are installed (F72)
    - {name: fork-point, do: snapshot}     # restored by later builds (D24)
    - {name: binpkgs, do: check-binpkgs}   # only where the stage `ships`: resolve
                                           # the image as the assembler will
                                           # (--pretend --usepkgonly --emptytree);
                                           # after the fork point, so a failure
                                           # keeps the stage's work
