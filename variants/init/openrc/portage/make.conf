# variants/init/openrc/portage/make.conf — the OpenRC seat USE (D24 step 3c).
# Written from the intent the recipe recorded when `use_prefer` was removed (F69:
# it never reached a build). Without it an openrc image built sys-apps/dbus and
# the rest with -elogind: no logind API for a graphical session's seat.
#
# The systemd side gets `udev` from profiles/targets/systemd; a profile without
# /systemd sets neither flag, so both are here. `-systemd` is not: nothing in a
# non-systemd profile enables it.
#
# USE="${USE} ..." and NOT USE="...": apply_portage CONCATENATES the layer
# make.conf files, and base has already expanded its USE block (F28).
SEAT="elogind udev"

USE="${USE} ${SEAT}"
