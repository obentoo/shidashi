# variants/init/openrc/recipe.yaml — OpenRC init (OVERVIEW §8/§14).
# profile_suffix: "" -- a profile WITHOUT /systemd (plain no-multilib).
# use_prefer turns on elogind and udev (seat = elogind + seatd) and drops
# systemd (§8, the init<->seat coupling). phases_prepend adds a `seat` phase
# BEFORE the base phases, installing elogind/seatd early.
init: openrc
profile_suffix: ""
use_prefer:
  add:  [elogind, udev]
  drop: [systemd]
phases_prepend:
  - { name: seat, packages: [sys-auth/elogind, sys-auth/seatd] }
