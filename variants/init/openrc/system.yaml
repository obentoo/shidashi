# variants/init/openrc/system.yaml — the services every OpenRC image adds.
#
# Handbook › System › Init configuration (`rc-update add <service> default`).
# Moved out of base/system.yaml on 2026-10-01: what depends on the init lives in
# the init layer. A flavor adds its display manager (flavor/<f>/system.yaml).
services:
  openrc:
    # `rc-update add <service> default`. Not yet exercised: no OpenRC image is
    # built so far.
    default:
      - dbus
      - NetworkManager
      - bluetooth
      - cupsd
      - avahi-daemon
      # bind's rndc key, generated per system instead of shipped in the image
      # (story 007): net-dns/bind's /etc/init.d/named does not generate a
      # missing key (read from named.init-r15, bind-9.20.29), so
      # rootfs/etc/init.d/rndc-keygen does, `before named`. Does nothing in an
      # image without bind.
      - rndc-keygen
