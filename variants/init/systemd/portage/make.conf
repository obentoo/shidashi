# variants/init/systemd/portage/make.conf — the SYSTEMD group, factored out of
# base (OVERVIEW §15). Moved from common/make.conf: the SYSTEMD="boot uki ukify"
# group and its ${SYSTEMD} entry in the USE block. Only the systemd init turns
# these flags on; openrc does not have them.
SYSTEMD="boot uki ukify"

# USE="${USE} ..." and NOT USE="...": apply_portage CONCATENATES the layer
# make.conf files, and base has already expanded its USE block by the time this
# line is read. A plain assignment here would replace base's entire curation
# with three flags (F28).
USE="${USE} ${SYSTEMD}"
