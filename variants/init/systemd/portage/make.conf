# variants/init/systemd/portage/make.conf — grupo SYSTEMD fatorado da base (OVERVIEW §15).
# Movido de common/make.conf: o grupo SYSTEMD="boot uki ukify" e a sua entrada
# ${SYSTEMD} no bloco USE. Só o init systemd liga estas flags; o openrc não as tem.
SYSTEMD="boot uki ukify"

# USE="${USE} ..." e nao USE="...": os make.conf dos layers sao CONCATENADOS
# por apply_portage, e a base ja expandiu o seu bloco USE quando esta linha e
# lida. Uma atribuicao simples aqui substituiria a curadoria inteira da base
# por tres flags (F28).
USE="${USE} ${SYSTEMD}"
