# variants/init/systemd/recipe.yaml — init systemd (OVERVIEW §8/§14).
# profile_suffix é um TOKEN PURO sem barra inicial — o merge acrescenta a barra,
# resultando em default/linux/amd64/23.0/no-multilib/systemd.
# use_prefer.add: [systemd] — habilita o init nativo (seat = systemd-logind).
init: systemd
profile_suffix: systemd
use_prefer:
  add:  [systemd]
