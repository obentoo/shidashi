# variants/livecd.yaml — what only the LIVE medium does, for every image.
#
# A top-level file like flow.yaml: one live medium, the same rules for every
# image, no layers. The installed system is described by the layers'
# system.yaml; this file adds what the live session needs on top of it, and an
# installer undoes it (removes this user, generates a machine-id). Applied by
# the assembler after the system configuration (shidashi.system).
#
# The author's decisions of 2026-09-30: user and password "bentoo", autologin.

user: bentoo
# The live medium's public password, documented like other live media's
# (Redcore: redcore/redcore). Needed for sudo and the lock screen. Hashed with
# SHA-512 when written to /etc/shadow; the clear text never reaches a log.
password: bentoo
full_name: Bentoo Live
shell: /bin/bash

# Supplementary groups, those that exist in the image (the rest are skipped):
# wheel for sudo, the device groups a desktop session needs, and the service
# groups that grant access without root (libvirt, docker, vboxusers...).
groups:
  - users
  - wheel
  - audio
  - video
  - input
  - render
  - cdrom
  - usb
  - plugdev
  - lpadmin
  - netdev
  - kvm
  - libvirt
  - docker
  - vboxusers
  - pipewire

# Log the live user in at boot: into the image's graphical session below, or,
# for an image without one (minimal), on the console on tty1.
autologin: true

# The session the live user is logged into, per image: a file name under
# /usr/share/wayland-sessions (or xsessions). The display manager that runs it
# is the image's own (flavor/<f>/system.yaml).
sessions:
  kde: plasma.desktop
  gnome: gnome.desktop

# Empty /etc/machine-id: systemd then generates one per boot, so no two copies of
# the ISO share an identity. The first ISO shipped a fixed one (F79).
empty_machine_id: true

# What the squashfs leaves out of the image's rootfs. The squashfs is the live
# medium AND what an installer copies to disk, so these are things no system
# should carry: mount points' content, the build's caches and logs, leftovers.
#
# Passed to `mksquashfs -wildcards -ef`: one pattern per entry, relative to the
# rootfs, `*` never crossing a `/`. `dir/*` drops the directory's CONTENT and
# keeps the directory itself -- the mount points the booted system needs (the
# first ISO dropped /dev, /proc, /sys and /run whole). Measured on 2026-09-30
# with a test tree: `dev/*` keeps /dev empty, `var/log/*.log` keeps the log
# directories services expect, `lost+found` goes whole.
squashfs_exclude:
  # The kernel and initramfs sit in the ISO's own boot/ (image.py), not in the root.
  - boot/*
  # Pseudo filesystems and runtime state: mounted or created at boot.
  - dev/*
  - proc/*
  - sys/*
  - run/*
  - tmp/*
  - mnt/*
  - var/tmp/*
  # The build's caches: the binhost bind mount, distfiles, Portage's own caches.
  - var/cache/binpkgs/*
  - var/cache/distfiles/*
  - var/cache/edb/*
  # The build's logs (the run's audit trail keeps them), not the image's.
  - var/log/*.log
  - var/log/portage/*
  # Shell history and filesystem leftovers.
  - root/.bash_history
  - root/.lesshst
  - lost+found

# Files a package or the build GENERATES at merge time that no two machines may
# share: a private key, a seed, a credential. Every copy of the ISO -- and every
# system installed from it -- would carry the same one. The assemble does not
# exclude them quietly: verify-config FAILS on any that is still in the rootfs,
# so the next package that generates one is a failing build, never a silent
# leak. Each must be generated on the booted system instead (rndc-keygen,
# sshd-keygen). Same pattern rules as squashfs_exclude; the comment line right
# above each entry names the package that generates it.
#
# Audit of the 2026-10-05 equivalence test (two kde rootfs built apart: of
# 273,876 paths, only these differed). Class: secret (a key, a seed, a
# credential: deny-listed below), identity (per build, but public) or derived
# (computed from the image's content):
#   etc/bind/rndc.key -- secret: net-dns/bind's pkg_postinst (rndc-confgen -a).
#   boot/initramfs-*.img -- derived: sys-kernel/dracut, from the image's modules
#     and its build time; no key inside.
#   boot/EFI/Linux/*.efi, the UKI -- derived: sys-kernel/installkernel and
#     systemd's ukify, from the kernel, the initramfs and the command line.
#   installkernel's files (the kernel copies and boot entries it writes) --
#     derived: sys-kernel/installkernel, from the installed kernel.
#   etc/os-release BUILD_ID -- identity: shidashi's build id, printed on purpose.
#   etc/shadow, the live user's hash salt -- identity: a random salt over the
#     documented public password (bentoo); nothing to keep secret.
#   usr/lib*/*.chk, the NSS .chk files -- derived: dev-libs/nss's shlibsign,
#     a signature of each library with a throwaway key; public.
#   etc/udev/hwdb.bin -- derived: sys-apps/systemd's systemd-hwdb update, from
#     the hwdb sources.
#   etc/passwd and etc/group, their line order -- derived: the order acct-user
#     and acct-group packages merged in; the same UIDs and GIDs.
build_time_secrets:
  # net-dns/bind's pkg_postinst (rndc-confgen -a): the named control channel key.
  - etc/bind/rndc.key
  # net-misc/openssh's private host keys (ssh-keygen -A), if run at build time.
  - etc/ssh/ssh_host_*_key
  # sys-apps/systemd's random seed (systemd-random-seed.service).
  - var/lib/systemd/random-seed
  # sys-apps/systemd's credential encryption key (systemd-creds setup).
  - var/lib/systemd/credential.secret

# Paths a build_time_secrets pattern matches that are known not to be secrets.
build_time_secrets_allow: []
