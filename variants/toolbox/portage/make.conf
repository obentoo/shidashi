# variants/toolbox/portage/make.conf — the toolbox stage (variants/toolbox).
#
# grub-mkrescue copies the GRUB modules of every platform it finds installed
# into the ISO: pc (BIOS) and efi-64 (UEFI) make the medium hybrid. Without one
# of them it does not fail -- it makes an ISO that boots on one firmware only.
GRUB_PLATFORMS="pc efi-64"
