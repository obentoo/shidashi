# /etc/containers/storage.conf — podman's storage on the worker (root's containers).
#
# The live root is RAM: podman's default graphroot (/var/lib/containers/storage)
# would put every image layer there, and the first multi-GB image would fill the
# memory the root overlay lives in. Images and layers go to the SHIDASHI-WORK disk
# instead (mounted at /mnt/work, see /etc/fstab); the runtime state stays in /run.
#
# Without the work disk, /mnt/work is an empty directory of the live root and podman
# would write there, in RAM: `shidashi worker status` shows whether the disk is mounted.
# Rootless podman (another user) keeps its own storage under that user's home.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/mnt/work/containers/storage"
