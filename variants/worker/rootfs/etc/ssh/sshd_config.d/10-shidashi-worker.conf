# Shidashi worker: key-only logins. The live medium's public password (bentoo)
# must never work over the network; root logs in with the host's paired key.
# Gentoo's sshd_config includes this directory; sshd keeps the first value it
# reads for each keyword, and the main file sets none of these.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
